name: Android build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # lets the build commit Room schema files back to the branch

# One build per branch at a time, so two runs never race to push schema commits.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ubuntu-latest ships the Android SDK (ANDROID_HOME is preset); AGP fetches any missing platform.
      - uses: gradle/actions/setup-gradle@v3

      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug

      # Room exports the database schema while compiling; keep it in the repo so future
      # migrations can be checked against every past version.
      - name: Commit Room schema changes
        if: github.event_name != 'pull_request'
        run: |
          if [ -n "$(git status --porcelain app/schemas)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add app/schemas
            git commit -m "Update Room schema files [skip ci]"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          else
            echo "Schema files unchanged."
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: pace-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: room-schemas
          path: app/schemas
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: app/build/reports/tests
          if-no-files-found: ignore
